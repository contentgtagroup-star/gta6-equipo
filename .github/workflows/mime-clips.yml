name: MIME del bucket clips

# Configuración de Supabase, no código de la app. Se ejecuta a mano desde Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  habilitar-jpeg:
    name: Agregar image/jpeg sin quitar los MIME actuales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_teuRF4rK0UsjEY2iUYw3ES4v
      VERCEL_PROJECT_ID: prj_54G9WHv8ggngapNEXRDDB0GJ3FTE
      VERCEL_TOKEN: ${{ secrets.GTADEPLOY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Habilitar image/jpeg en el bucket privado clips
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Falta configurar GTADEPLOY en GitHub Actions.'; exit 1; }

          # `vercel pull` no baja secretos; se leen con la API y no se imprimen.
          curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&decrypt=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > "$RUNNER_TEMP/vars.json"
          echo "Variables visibles: $(jq -r '(.envs // .) | map(.key) | join(", ")' "$RUNNER_TEMP/vars.json")"
          echo "Ocultas de producción: $(jq -r '.hiddenProductionEnvCount // 0' "$RUNNER_TEMP/vars.json")"
          jq -r '(.envs // .)[] | select(.key == "SUPABASE_URL" or .key == "SUPABASE_SERVICE_KEY") | "\(.key) target=\(.target) type=\(.type) decrypted=\(.decrypted) tieneValor=\((.value // "") | length > 0)"' "$RUNNER_TEMP/vars.json"
          id_de() {
            jq -r --arg key "$1" '
              def es_prod: if (.target | type) == "array" then (.target | index("production") != null) else .target == "production" end;
              (.envs // .) | .[] | select(.key == $key and es_prod) | .id
            ' "$RUNNER_TEMP/vars.json" | head -n 1
          }
          valor_de() {
            local id respuesta
            id=$(id_de "$1")
            test -n "$id" || { echo "No hay ID de producción para $1."; return 1; }
            respuesta=$(curl -fsS "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer $VERCEL_TOKEN") || return 1
            jq -r '"\(.key) decrypted=\(.decrypted) tieneValor=\((.value // "") | length > 0)"' <<< "$respuesta"
            jq -r '.value // empty' <<< "$respuesta"
          }

          BASE=$(valor_de SUPABASE_URL || true)
          KEY=$(valor_de SUPABASE_SERVICE_KEY || true)
          test -n "$KEY" || KEY=$(valor_de SUPABASE_SERVICE_ROLE_KEY || true)
          test -n "$BASE" || { echo 'Falta SUPABASE_URL en la configuración de producción de Vercel.'; exit 1; }
          test -n "$KEY" || { echo 'Falta la clave de servicio de Supabase en la configuración de producción de Vercel.'; exit 1; }
          BASE="${BASE%/}"
          AUTH=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")

          curl -fsS "${BASE}/storage/v1/bucket/clips" "${AUTH[@]}" > "$RUNNER_TEMP/bucket.json"

          jq -e '.id == "clips"' "$RUNNER_TEMP/bucket.json" > /dev/null
          jq -c '
            (.allowed_mime_types // []) as $actuales |
            if ($actuales | index("image/jpeg")) then $actuales else $actuales + ["image/jpeg"] end
          ' "$RUNNER_TEMP/bucket.json" > "$RUNNER_TEMP/mimes.json"
          MIMES=$(cat "$RUNNER_TEMP/mimes.json")
          echo "MIME antes: $(jq -c '.allowed_mime_types // []' "$RUNNER_TEMP/bucket.json")"
          echo "MIME después: $MIMES"

          jq -c --argjson mimes "$MIMES" '
            {id: .id, name: .name, public: .public, allowed_mime_types: $mimes}
            + (if .file_size_limit != null then {file_size_limit: .file_size_limit} else {} end)
          ' "$RUNNER_TEMP/bucket.json" > "$RUNNER_TEMP/body.json"

          curl -fsS -X PUT "${BASE}/storage/v1/bucket/clips" \
            "${AUTH[@]}" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/body.json" > "$RUNNER_TEMP/respuesta.json"

          curl -fsS "${BASE}/storage/v1/bucket/clips" "${AUTH[@]}" > "$RUNNER_TEMP/final.json"
          jq -e '(.allowed_mime_types // []) | index("image/jpeg") != null' "$RUNNER_TEMP/final.json" > /dev/null
          echo "Verificado: el bucket clips conserva sus tipos y ahora acepta image/jpeg."
          echo "MIME finales: $(jq -c '.allowed_mime_types' "$RUNNER_TEMP/final.json")"
          echo 'image/jpeg habilitado en el bucket clips de Supabase.' >> "$GITHUB_STEP_SUMMARY"
