name: Verificar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm test
        working-directory: app
      - run: python3 -m py_compile app/herramientas/*.py
      - run: python3 -m unittest discover -s app/tests -p 'test_*.py'
  desplegar:
    name: Publicar GTA
    needs: pruebas
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gta6-produccion
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: gta6-produccion
      url: ${{ steps.publicar.outputs.url }}
    env:
      VERCEL_ORG_ID: team_teuRF4rK0UsjEY2iUYw3ES4v
      VERCEL_PROJECT_ID: prj_54G9WHv8ggngapNEXRDDB0GJ3FTE
      VERCEL_TOKEN: ${{ secrets.GTADEPLOY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Preparar Vercel
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Falta configurar GTADEPLOY en GitHub Actions.'; exit 1; }
          npm install --global vercel@65.9.0
          vercel pull --yes --environment=production --non-interactive
      - name: Construir la versión aprobada
        run: vercel build --prod --non-interactive
      - name: Publicar en el proyecto GTA existente
        id: publicar
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --non-interactive
          url=https://gta6-equipo.vercel.app
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### GTA publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
